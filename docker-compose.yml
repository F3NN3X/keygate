services:
  keygate:
    # Build from our fork so local code changes (e.g. implicit-TLS SMTP for
    # Cloudflare) are included. To fall back to upstream's prebuilt binary,
    # comment this out and restore: image: ghcr.io/tabloy/keygate:v0.1.3
    build: .
    # No host port published: Dokploy's Traefik reaches the container over the
    # dokploy-network and terminates TLS for the domain below.
    expose:
      - "9000"
    environment:
      PORT: "9000"
      ENVIRONMENT: production
      BASE_URL: https://license.deckshot.app
      DATABASE_URL: postgres://keygate:${POSTGRES_PASSWORD}@postgres:5432/keygate?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Dokploy env}
      LICENSE_SIGNING_KEY: ${LICENSE_SIGNING_KEY:?Set LICENSE_SIGNING_KEY in Dokploy env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - dokploy-network

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: keygate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy env}
      POSTGRES_DB: keygate
    volumes:
      # postgres:18+ images expect the volume mounted at /var/lib/postgresql
      # (data lives in a versioned subdirectory); mounting .../data makes
      # initdb fail on a fresh volume. https://github.com/docker-library/postgres/issues/37
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keygate"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

volumes:
  pgdata:

networks:
  # Dokploy creates this network; Traefik lives here and routes your domain
  # to the keygate container. It already exists, so we mark it external.
  dokploy-network:
    external: true
